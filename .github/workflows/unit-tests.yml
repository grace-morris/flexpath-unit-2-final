name: Java

on:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Set up JDK 1.17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Install legacy ncurses library for embedded MariaDB
        run: sudo apt-get update && sudo apt-get install -y libncurses5

      - name: Build
        working-directory: ./java-springboot-final
        run: mvn --batch-mode -DskipTests package

      - name: Test
        working-directory: ./java-springboot-final
        run: mvn --batch-mode -Dmaven.test.failure.ignore=true test

      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: ./java-springboot-final/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
